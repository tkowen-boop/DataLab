<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shot Lab</title>
<meta name="description" content="Shot-by-shot strokes gained tracker for competitive golf.">
<meta name="theme-color" content="#0d4a31">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shot Lab">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Public Sans';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/public-sans-latin-wght-normal.woff2) format('woff2')}
img{max-width:100%}[hidden]{display:none!important}
/* Layout: a leaderboard-green board across the top, one working column for on-course entry, two-column stat boards on wider screens */
:root{
  --paper:#f3f5ef;--card:#ffffff;--card2:#eef2ea;--ink:#13201a;--mute:#56645b;--dim:#8b978f;--line:#dbe2d8;--line2:#c4cec2;
  --board:#0d4a31;--board2:#0a3b27;--board-ink:#f2f6ee;--board-mute:#a9c4b3;
  --gain:#17773f;--gain-soft:rgba(23,119,63,.12);--loss:#c0392b;--loss-soft:rgba(192,57,43,.11);
  --under:#c8102e;--flag:#e2a900;--base:#2a6aa8;--base-soft:rgba(42,106,168,.12);
  --rough:#cfe0c3;--fair:#a9d18e;--greenc:#79bf6a;--sand:#ead9a6;--water:#9cc7e6;--tee:#8dc47b;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="sun"]){
  --paper:#0b120e;--card:#131c17;--card2:#19241e;--ink:#e5ece6;--mute:#97a69c;--dim:#66746b;--line:#25312a;--line2:#33433a;
  --board:#0e3b27;--board2:#0a2c1d;--board-ink:#eef4ec;--board-mute:#8fb39d;
  --gain:#5cc285;--gain-soft:rgba(92,194,133,.14);--loss:#f2735c;--loss-soft:rgba(242,115,92,.13);
  --under:#ff5b70;--flag:#f2c230;--base:#72aee6;--base-soft:rgba(114,174,230,.14);
  --rough:#1d3324;--fair:#2c5234;--greenc:#3d7a43;--sand:#6b6045;--water:#2b4b63;--tee:#356b3d;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0b120e;--card:#131c17;--card2:#19241e;--ink:#e5ece6;--mute:#97a69c;--dim:#66746b;--line:#25312a;--line2:#33433a;
  --board:#0e3b27;--board2:#0a2c1d;--board-ink:#eef4ec;--board-mute:#8fb39d;
  --gain:#5cc285;--gain-soft:rgba(92,194,133,.14);--loss:#f2735c;--loss-soft:rgba(242,115,92,.13);
  --under:#ff5b70;--flag:#f2c230;--base:#72aee6;--base-soft:rgba(114,174,230,.14);
  --rough:#1d3324;--fair:#2c5234;--greenc:#3d7a43;--sand:#6b6045;--water:#2b4b63;--tee:#356b3d;color-scheme:dark}
/* Sunlight: maximum contrast for reading on the course */
:root[data-theme="sun"]{
  --paper:#ffffff;--card:#ffffff;--card2:#f1f3f0;--ink:#000000;--mute:#222a25;--dim:#4a554e;--line:#9aa59e;--line2:#5d6a62;
  --board:#003d22;--board2:#002a17;--board-ink:#ffffff;--board-mute:#d6e8dc;
  --gain:#006b2c;--gain-soft:rgba(0,107,44,.14);--loss:#b3000c;--loss-soft:rgba(179,0,12,.12);
  --under:#c4001f;--flag:#b88600;--base:#0049a3;--base-soft:rgba(0,73,163,.12);color-scheme:light}
:root[data-theme="sun"] .chip,:root[data-theme="sun"] .btn,:root[data-theme="sun"] input,:root[data-theme="sun"] select{border-width:2px;font-weight:700}
:root{color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font:15px/1.45 var(--body);margin:0;-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--board)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:.02em;text-wrap:balance}
h1{font-size:30px;line-height:1}h2{font-size:22px;line-height:1.1}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);font-family:var(--body);font-weight:700}
.num,td,.tab{font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}.dim{color:var(--dim)}.small{font-size:13px}.tiny{font-size:11.5px}
/* top board */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--board);color:var(--board-ink);box-shadow:0 1px 0 var(--board2)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.12em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;color:var(--board-mute);text-decoration:none;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;padding:10px 11px;min-height:44px;display:flex;align-items:center;border-bottom:3px solid transparent}
nav.tabs a[aria-current=page]{color:var(--board-ink);border-bottom-color:var(--flag)}
.sync{font-size:11.5px;color:var(--board-mute);white-space:nowrap;display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--board-mute);display:inline-block}
.sync.ok i{background:#7be0a0}.sync.busy i{background:var(--flag)}.sync.off i{background:#ff9b8a}
main{max-width:1180px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* building blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card>h3{margin-bottom:10px}
.why{color:var(--mute);font-size:13px;margin:10px 0 0;padding-top:8px;border-top:1px dashed var(--line2)}
.why b{color:var(--ink);font-weight:600}
.grid{display:grid;gap:12px}
.cols{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:start}
.cols2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));align-items:start}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:2px 0 14px}
.pagehead p{margin:4px 0 0;color:var(--mute);max-width:70ch}
.btn{min-height:46px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:var(--card);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--board);color:var(--board-ink);border-color:var(--board)}
.btn.warn{color:var(--loss);border-color:var(--loss)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;min-height:44px;min-width:44px;padding:0 12px;border-radius:9px;border:1px solid var(--line2);background:var(--card);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;position:relative;line-height:1.1;text-align:center}
.chip.sm{min-height:38px;font-size:13px;padding:0 10px}
.chip[aria-pressed=true]{background:var(--board);color:var(--board-ink);border-color:var(--board)}
.chip.need{border-color:var(--flag);box-shadow:0 0 0 2px color-mix(in srgb,var(--flag) 35%,transparent)}
.chip.sugg::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--flag)}
.chip.bad[aria-pressed=true]{background:var(--loss);border-color:var(--loss);color:#fff}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mute);min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--card);border:1px solid var(--line2);border-radius:9px;padding:9px 10px;min-height:44px;width:100%;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.fgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--mute);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
td.n,th.n{text-align:right}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.sg{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.sg.pos{color:var(--gain)}.sg.neg{color:var(--loss)}.sg.zero{color:var(--mute)}
.tag{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:2px 7px;border-radius:99px;border:1px solid var(--line2);color:var(--mute);white-space:nowrap}
.tag.act{background:var(--loss);border-color:var(--loss);color:#fff}
.tag.watch{color:var(--flag);border-color:var(--flag)}
.tag.ex{background:var(--flag);border-color:var(--flag);color:#1b1500}
.kpis{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}
.kpi{background:var(--card2);border-radius:10px;padding:10px 12px;min-width:0}
.kpi .l{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.kpi .v{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--mute)}
.empty{border:1px dashed var(--line2);border-radius:10px;padding:18px;text-align:center;color:var(--mute);font-size:13.5px}
.empty b{display:block;color:var(--ink);margin-bottom:3px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:color-mix(in srgb,var(--flag) 16%,var(--card));border:1px solid color-mix(in srgb,var(--flag) 55%,var(--line));border-radius:12px;padding:12px 14px;margin-bottom:14px}
.subnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding-bottom:2px}
.subnav::-webkit-scrollbar{display:none}
.subnav a{flex:none;text-decoration:none;color:var(--mute);border:1px solid var(--line2);border-radius:99px;padding:8px 14px;font-weight:600;font-size:13.5px;min-height:40px;display:flex;align-items:center;background:var(--card)}
.subnav a[aria-current=page]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
svg.ch{width:100%;height:auto;display:block;overflow:visible}
svg text{fill:var(--mute);font:500 11px var(--body)}
svg .lbl{fill:var(--ink);font-weight:600}
svg .gl{stroke:var(--line);stroke-width:1}
/* scorecard symbols */
.sc{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.sc.b{border:1.5px solid var(--under);border-radius:50%;color:var(--under)}
.sc.e{border:1.5px solid var(--under);border-radius:50%;color:var(--under);box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--under)}
.sc.bo{border:1.5px solid var(--ink)}
.sc.d{border:1.5px solid var(--ink);box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--ink)}
.scard td,.scard th{text-align:center;padding:5px 3px;font-size:13px}
.scard td:first-child,.scard th:first-child{text-align:left;padding-left:0}
/* entry */
.entry{max-width:640px;margin:0 auto}
.holebar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:20;background:var(--board);color:var(--board-ink);border-radius:12px;padding:8px;display:flex;align-items:center;gap:6px;margin-bottom:10px}
.holebar .hn{flex:1;text-align:center;min-width:0}
.holebar .hn b{font-family:var(--display);font-size:24px;letter-spacing:.03em;display:block;line-height:1.05}
.holebar .hn span{font-size:12.5px;color:var(--board-mute)}
.holebar button{background:transparent;border:1px solid var(--board-mute);color:var(--board-ink);border-radius:9px;min-width:44px;min-height:44px;font-size:20px}
.holebar button[disabled]{opacity:.3}
.strip{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding:2px}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;width:40px;border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:3px 0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;color:var(--mute)}
.strip button[aria-current=true]{border-color:var(--board);box-shadow:0 0 0 2px var(--board)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.sec>.lab{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sec>.lab h3{margin:0}
.sub{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:700;margin:12px 0 6px}
.distrow{display:flex;align-items:center;gap:6px}
.distrow input{font-family:var(--display);font-size:34px;font-weight:700;text-align:center;min-height:58px;padding:2px 6px;flex:1;min-width:0}
.distrow .unit{font-family:var(--display);font-size:18px;color:var(--mute);width:28px}
.distrow .adj{min-width:44px;min-height:58px;border-radius:9px;border:1px solid var(--line2);background:var(--card2);font-weight:700}
.compass{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:5px;flex:none}
.compass button{border:1px solid var(--line2);background:var(--card);border-radius:9px;font-size:20px;font-weight:700;padding:0}
.compass button[aria-pressed=true]{background:var(--board);color:var(--board-ink);border-color:var(--board)}
.compass .calm{font-size:11px;font-weight:700;text-transform:uppercase}
.windbox{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.windbox .side{flex:1;min-width:180px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:330px}
.rgrid button{min-height:52px;border:1px solid var(--line2);background:var(--card);border-radius:9px;font-size:12.5px;font-weight:600;line-height:1.15;padding:4px}
.rgrid button.ctr{background:var(--gain-soft)}
.rgrid button[aria-pressed=true]{background:var(--board);color:var(--board-ink);border-color:var(--board)}
.preview{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card2);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.actionbar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.actionbar .btn{min-height:56px;font-size:17px}
details.more{border-top:1px solid var(--line);margin-top:12px;padding-top:4px}
details.more>summary{cursor:pointer;list-style:none;font-weight:600;font-size:13.5px;min-height:40px;display:flex;align-items:center;justify-content:space-between;color:var(--mute)}
details.more>summary::after{content:"+";font-size:18px}
details.more[open]>summary::after{content:"−"}
/* leaks */
.leak{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.leak:last-child{border-bottom:0}
.leak .rk{font-family:var(--display);font-size:24px;font-weight:700;color:var(--dim);text-align:center;line-height:1}
.leak .tip{color:var(--mute);font-size:13px;margin-top:3px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* sheet + toast */
#sheet{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5)}
#sheet.on{display:flex}
#sheet .pn{background:var(--card);border-radius:18px 18px 0 0;width:min(640px,100%);max-height:90vh;overflow:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media(min-width:760px){#sheet{align-items:center}#sheet .pn{border-radius:18px}}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;max-width:240px;box-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;white-space:pre-line;color:var(--ink)}
#tip.on{opacity:1}
.howto p,.howto li{color:var(--mute);max-width:72ch}
.howto b{color:var(--ink)}
.howto h2{margin:22px 0 6px}
.formula{font-family:ui-monospace,Menlo,monospace;background:var(--card2);border-radius:8px;padding:8px 10px;display:inline-block;color:var(--ink)}
/* v3 additions: entry mode switch, GPS row, update bar */
.modebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;min-height:36px;padding:0 14px;font-weight:600;font-size:13.5px;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.gpsrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.btn.gps{border-color:var(--base);color:var(--base)}
.updbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:29;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;background:var(--flag);color:#1b1500;font-weight:600;font-size:14px;padding:8px 16px}
.updbar[hidden]{display:none!important}
code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:var(--card2);padding:1px 5px;border-radius:5px}
nav.tabs .ni{display:none;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs .ns{display:none}
.top-in{min-height:56px}
/* iPhone: the main tabs become a bottom tab bar */
@media (max-width:759px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:36;background:var(--board);display:grid;grid-template-columns:repeat(6,1fr);gap:0;overflow:visible;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -1px 0 var(--board2);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

      }
    }
    holes.push(hs);
  });
  const done = holes.filter(h => h.done);
  const sumH = { round: r, holes, rows, nDone: done.length, score: sum(done.map(h => h.score)), par: sum(done.map(h => h.par)),
    sg: sum(rows.map(x => x.sg)), sgA: sum(rows.map(x => x.sgA)), cats: {}, catsA: {} };
  CATS.forEach(c => { sumH.cats[c] = sum(rows.filter(x => x.cat === c).map(x => x.sg)); sumH.catsA[c] = sum(rows.filter(x => x.cat === c).map(x => x.sgA)); });
  sumH.toPar = sumH.score - sumH.par;
  /* bounce back */
  let bbA = 0, bbS = 0; for (let i = 1; i < holes.length; i++){ const p = holes[i - 1], c = holes[i]; if (p.done && c.done && p.rel >= 1){ bbA++; if (c.rel <= -1) bbS++; } }
  sumH.bbA = bbA; sumH.bbS = bbS;
  return sumH;
}

/* =====================================================================
   Store: local mirror + db sync (one document per round)
   ===================================================================== */
const APP_VERSION = '3.0.0';
const LS_KEY = 'shotlab2', SYNC_KEY = 'shotlab.sync', GIST_FILE = 'shotlab-data.json';
const St = { rounds: {}, courses: {}, meta: { bag: BAG_DEFAULT.map(b => b.slice()), view: 'pga', scope: 'all', rtype: 'all', base: 'tour', entry: 'full', theme: 'auto', wake: true, updated: 0 }, active: null, ex: false };

/* IndexedDB keeps a durable copy of everything; localStorage is the fast synchronous mirror. */
const IDB = {
  db: null,
  open(){ return new Promise(res => { try { const r = indexedDB.open('shotlab', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => { IDB.db = r.result; res(r.result); }; r.onerror = () => res(null); } catch (e) { res(null); } }); },
  async get(k){ const db = IDB.db || await IDB.open(); if (!db) return null; return new Promise(res => { try { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result ?? null); q.onerror = () => res(null); } catch (e) { res(null); } }); },
  async set(k, v){ const db = IDB.db || await IDB.open(); if (!db) return; return new Promise(res => { try { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => res(); } catch (e) { res(); } }); }
};
const snapshot = () => JSON.stringify({ rounds: St.rounds, courses: St.courses, meta: St.meta, active: St.active });
function loadLocal(){
  try { const raw = localStorage.getItem(LS_KEY); if (!raw) return; const o = JSON.parse(raw); Object.assign(St.rounds, o.rounds || {}); Object.assign(St.courses, o.courses || {}); if (o.meta) St.meta = Object.assign(St.meta, o.meta); St.active = o.active || null; } catch (e) {}
}
async function loadDurable(){
  const raw = await IDB.get('data'); if (!raw) { IDB.set('data', snapshot()); return; }
  let o; try { o = JSON.parse(raw); } catch (e) { return; }
  const ch = mergeData(o);

  if (ch){ saveLocal(); Cache.clear(); App.render(); }
}
let idbT = null;
function saveLocal(){
  const snap = snapshot();
  try { localStorage.setItem(LS_KEY, snap); } catch (e) {}
  clearTimeout(idbT); idbT = setTimeout(() => IDB.set('data', snapshot()), 400);

/* Merge another copy of the data (IndexedDB, an import, or the cloud) into this one. Newest edit of each round wins. */
function mergeData(o){
  let ch = false;
  for (const [coll, map] of [['rounds', St.rounds], ['courses', St.courses]]){
    for (const v of Object.values((o && o[coll]) || {})){
      if (!v || !v.id) continue;
      const loc = map[v.id];
      if (!loc || (v.updated || 0) > (loc.updated || 0)){ map[v.id] = JSON.parse(JSON.stringify(v)); ch = true; }
    }
  }
  if (o && o.meta && (o.meta.updated || 0) > (St.meta.updated || 0)){ St.meta = Object.assign(St.meta, o.meta); ch = true; }
  return ch;
}

/* Optional cloud sync through a private GitHub Gist, so the phone and the laptop share rounds. */
const Sync = {
  state: 'local', cfg: null, timer: null, busy: false, again: false,
  load(){ try { Sync.cfg = JSON.parse(localStorage.getItem(SYNC_KEY) || 'null'); } catch (e) { Sync.cfg = null; } Sync.setState(Sync.on() ? 'idle' : 'local'); },
  saveCfg(){ try { Sync.cfg ? localStorage.setItem(SYNC_KEY, JSON.stringify(Sync.cfg)) : localStorage.removeItem(SYNC_KEY); } catch (e) {} },
  on(){ return !!(Sync.cfg && Sync.cfg.token && Sync.cfg.gist); },
  setState(s, msg){
    Sync.state = s; Sync.msg = msg || '';
    const el = $('#sync'); if (!el) return;
    el.className = 'sync ' + ({ ok: 'ok', busy: 'busy', off: 'off', err: 'off', idle: 'ok' }[s] || '');
    el.lastChild.textContent = { ok: 'Synced', idle: 'Sync on', busy: 'Syncing', off: 'Offline · saved', err: msg || 'Sync problem', local: 'On this phone' }[s] || 'On this phone';
  },
  async api(path, opt = {}){
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 20000);
    try {
      const r = await fetch('https://api.github.com' + path, { method: opt.method || 'GET', body: opt.body, signal: ctl.signal, cache: 'no-store',
        headers: Object.assign({ Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', Authorization: 'Bearer ' + Sync.cfg.token }, opt.body ? { 'Content-Type': 'application/json' } : {}) });
      if (!r.ok){ const e = new Error('GitHub said ' + r.status); e.status = r.status; throw e; }
      return r.status === 204 ? null : r.json();
    } finally { clearTimeout(to); }
  },
  payload(){ return JSON.stringify({ app: 'shotlab', v: 3, saved: Date.now(), rounds: St.rounds, courses: St.courses, meta: St.meta }); },
  async connect(token){
    Sync.cfg = { token: token.trim() };
    const list = await Sync.api('/gists?per_page=100');
    const g = (list || []).find(x => x.files && x.files[GIST_FILE]);
    if (g) Sync.cfg.gist = g.id;
    else { const c = await Sync.api('/gists', { method: 'POST', body: JSON.stringify({ description: 'Shot Lab data (private, used by the Shot Lab app)', public: false, files: { [GIST_FILE]: { content: Sync.payload() } } }) }); Sync.cfg.gist = c.id; }
    Sync.saveCfg(); await Sync.now();
  },
  async pull(){
    const g = await Sync.api('/gists/' + Sync.cfg.gist);
    const f = g.files && g.files[GIST_FILE]; if (!f) return null;
    let txt = f.content;
    if (f.truncated){ const r = await fetch(f.raw_url, { cache: 'no-store' }); txt = await r.text(); }
    try { return JSON.parse(txt); } catch (e) { return null; }
  },
  needsPush(remote){
    if (!remote) return true;
    for (const [coll, map] of [['rounds', St.rounds], ['courses', St.courses]]){
      const rm = remote[coll] || {};
      for (const v of Object.values(map)){ const r = rm[v.id]; if (!r || (v.updated || 0) > (r.updated || 0)) return true; }
    }
    return (St.meta.updated || 0) > ((remote.meta || {}).updated || 0);
  },
  async now(){
    clearTimeout(Sync.timer); Sync.timer = null;
    if (!Sync.on()) return;
    if (!navigator.onLine){ Sync.setState('off'); return; }
    if (Sync.busy){ Sync.again = true; return; }
    Sync.busy = true; Sync.setState('busy');
    try {
      const remote = await Sync.pull();
      if (remote && mergeData(remote)){ saveLocal(); Cache.clear(); if (!Entry.typing) App.render(); }
      if (Sync.needsPush(remote)) await Sync.api('/gists/' + Sync.cfg.gist, { method: 'PATCH', body: JSON.stringify({ files: { [GIST_FILE]: { content: Sync.payload() } } }) });
      Sync.cfg.last = Date.now(); Sync.saveCfg(); Sync.setState('ok');
    } catch (e){
      if (e.status === 401) Sync.setState('err', 'Sync token rejected');
      else if (e.status === 403) Sync.setState('err', 'Token needs gist access');
      else if (e.status === 404) Sync.setState('err', 'Sync gist not found');
      else Sync.setState('off');
    }
    Sync.busy = false;
    if (Sync.again){ Sync.again = false; Sync.soon(2000); }
    if (location.hash === '#setup' && !Entry.typing) App.render();
  },
  soon(ms = 15000){ if (!Sync.on()) return; clearTimeout(Sync.timer); Sync.timer = setTimeout(Sync.now, ms); },
  disconnect(){ Sync.cfg = null; Sync.saveCfg(); Sync.setState('local'); }
};
function saveRound(r){ r.updated = Date.now(); St.rounds[r.id] = r; saveLocal(); Cache.clear(); Sync.soon(); }
function saveCourse(c){ c.updated = Date.now(); St.courses[c.id] = c; saveLocal(); Sync.soon(); }
function saveMeta(){ St.meta.updated = Date.now(); saveLocal(); Cache.clear(); Sync.soon(); }
const Cache = { m: new Map(), clear(){ this.m.clear(); }, get(k, f){ if (!this.m.has(k)) this.m.set(k, f()); return this.m.get(k); } };
/* Rules-safe mode: during a competitive round nothing analyses the round in progress (Rule 4.3a). */
const tm = r => !!(r && r.tmode && r.status !== 'done');
const realRounds = () => Object.values(St.rounds).filter(r => !r.deleted).sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.created || 0) - (a.created || 0));

/* =====================================================================
   Example data (shown only until the first real round exists; never saved)
   ===================================================================== */
const Example = {
  course: { name: 'Example Golf Club', tees: 'Championship', holes: [[4,452,5],[5,548,11],[4,431,7],[3,198,15],[4,468,1],[4,409,13],[3,221,17],[5,571,9],[4,447,3],[4,430,8],[3,176,18],[4,476,2],[5,592,10],[4,415,14],[4,462,4],[3,232,16],[4,438,12],[5,560,6]].map(([par, yards, si]) => ({ par, yards, si })) },
  rounds(){
    if (Example._r) return Example._r;
    const rand = rng(20261030), g = (m = 0, s = 1) => m + s * Math.sqrt(-2 * Math.log(Math.max(1e-9, rand()))) * Math.cos(2 * Math.PI * rand());
    const pick = a => a[Math.floor(rand() * a.length)];
    const out = [];
    const dates = ['2026-09-12','2026-09-19','2026-09-27','2026-10-04','2026-10-11','2026-10-18','2026-10-25'];
    dates.forEach((date, ri) => {
      const ws = [4, 11, 7, 15, 6, 9, 12][ri];
      const r = { id: 'ex' + ri, ex: true, date, course: Example.course.name, tees: 'Championship', type: ri % 3 === 0 ? 'tournament' : 'casual', status: 'done',
        holes: Example.course.holes.map(h => ({ ...h, shots: [], done: true })) };
      r.holes.forEach(h => {
        let d = h.yards, lie = 'tee', guard = 0;
        while (guard++ < 10){
          const s = { d: r1(d), lie, q: (QUAL[lie] || []).length ? ((QUAL[lie].find(q => q[0] === 'good') || QUAL[lie][0])[0]) : undefined, sl: 'flat', wd: pick(Object.keys(WIND)), ws, ts: 0 };
          if (lie === 'rough' && rand() < .25) s.q = pick(['down','flyer','up']);
          if (lie !== 'tee' && lie !== 'green' && rand() < .3) s.sl = pick(['up','down','above','below']);
          h.shots.push(s);
          if (guard === 10){ break; }
          if (lie === 'green'){
            s.club = 'Putter'; s.type = 'putt'; s.brk = pick(['straight','lr','rl','lr','rl']); s.pslope = pick(['up','flat','down']); delete s.wd; delete s.ws; delete s.sl;
            let p = I(TOUR_MAKE, d); if (d >= 4 && d <= 9) p -= .1; else p += .03;
            if (rand() < p) break;
            const leave = d < 9 ? .8 + rand() * 2 : Math.max(.8, d * .075 + Math.abs(g(0, 1.4)));
            s.miss = d > 18 ? pick(['short','long','long','short','high']) : pick(['high','low','low','long','short']);
            d = r1(leave); lie = 'green'; continue;
          }
          const y = yd(d, lie);
          if (lie !== 'tee' && y <= 30){
            s.club = lie === 'gs_bunker' ? '58' : y < 12 ? '58' : '54'; s.type = lie === 'gs_bunker' ? 'bunker' : y < 12 ? 'chip' : 'pitch'; s.aim = 'close'; s.act = 'asplan'; s.shape = 'straight';
            if (rand() < .035) break;
            const base = lie === 'gs_bunker' ? 6.5 : lie === 'rough' ? 5 : 3.4;
            const ft = Math.max(1, base * Math.exp(g(0, .45)) * (1 + y / 40));
            s.dir = pick(['C','C','S0','L0','ML','MR']); d = r1(ft); lie = 'green'; continue;
          }
          if (lie === 'tee' && h.par >= 4){
            s.club = 'Dr'; s.aim = 'center'; s.shape = 'draw'; s.type = 'full';
            const tot = 300 + g(0, 11) - (ws > 12 ? 6 : 0), x = rand();
            let el, dir, act;
            if (x < .58){ el = 'fairway'; dir = 'C'; act = pick(['asplan','asplan','asplan','straight']); } else if (x < .7){ el = 'rough'; dir = 'ML'; act = pick(['hook','pull']); } else if (x < .87){ el = 'rough'; dir = 'MR'; act = pick(['fade','push','straight']); }
            else if (x < .93){ el = 'fw_bunker'; dir = pick(['ML','MR']); act = 'push'; } else if (x < .975){ el = 'recovery'; dir = 'MR'; act = 'slice'; } else { el = 'pen'; dir = 'MR'; act = 'slice'; }
            s.dir = dir; s.act = act; s.strike = 'pure';
            if (el === 'pen'){ s.pen = 'water'; d = Math.max(60, d - tot + 25); lie = 'rough'; continue; }
            d = Math.max(25, Math.round(d - tot)); lie = el; continue;
          }
          /* approach or layup */
          if (h.par === 5 && h.shots.length === 2 && y > 255){
            s.club = '5i'; s.aim = 'layup'; s.type = 'layup'; s.shape = 'straight'; s.act = 'asplan'; s.dir = 'C';
            d = Math.round(80 + rand() * 30); lie = rand() < .82 ? 'fairway' : 'rough'; continue;
          }
          let club = 'PW', best = 1e9; for (const [c, ca, to] of BAG_DEFAULT){ if (c === 'Putter') continue; const v = Math.abs((ca + to) / 2 - y); if (v < best){ best = v; club = c; } }
          s.club = club; s.type = 'full'; s.aim = y < 130 ? 'pin' : pick(['pin','middle','middle']); s.shape = clubGroup(club) === 'Mid irons' ? 'straight' : pick(['straight','draw','fade']);
          const fadeHabit = clubGroup(club) === 'Mid irons' && rand() < .5;
          s.act = fadeHabit ? 'fade' : rand() < .82 ? 'asplan' : pick(['pull','push']);
          s.strike = rand() < .82 ? 'pure' : pick(['thin','fat','toe']);
          const mult = (lie === 'rough' ? 1.45 : lie === 'deep_rough' ? 2 : lie === 'fw_bunker' ? 1.6 : lie === 'recovery' ? 2.6 : lie === 'first_cut' ? 1.15 : 1) * (s.q === 'down' ? 1.35 : 1) * (fadeHabit ? 1.35 : 1) * (s.strike === 'pure' ? 1 : 1.5);
          const prox = I(TOUR_PROX_FW, y) * .97 * mult * Math.exp(g(0, .4));
          if (lie === 'recovery' && rand() < .6){ s.aim = 'out'; s.type = 'punch'; d = Math.round(y * .4 + 20); lie = 'fairway'; s.dir = 'C'; continue; }
          if (prox < 1.2 && rand() < .5) break;

          s.dir = fadeHabit ? pick(['MR','SR','LR']) : pick(['ML','MR','S0','L0','SL','SR','LL','LR']);
          const ml = rand(); const miss = 4 + rand() * 22;
          if (ml < .33){ lie = 'gs_bunker'; d = r1(miss); } else if (ml < .7){ lie = 'rough'; d = r1(miss); } else { lie = 'fringe'; d = r1(Math.min(miss, 12) * 3); }
        }

  }
};

/* =====================================================================
   Aggregation over many rounds (filtered), cached
   ===================================================================== */
function scopeRounds(){
  const real = realRounds().filter(r => !tm(r) && (r.status === 'done' || (r.holes || []).some(h => h.done)));
  const useEx = !real.length;
  St.ex = useEx;
  let list = useEx ? Example.rounds().slice().reverse() : real;
  if (St.meta.rtype === 'comp') list = list.filter(r => r.type === 'tournament' || r.type === 'qualifier');
  else if (St.meta.rtype === 'casual') list = list.filter(r => r.type === 'casual' || r.type === 'practice');
  if (St.meta.scope !== 'all') list = list.slice(0, +St.meta.scope);
  return list;
}
function agg(){
  return Cache.get('agg|' + St.meta.scope + '|' + St.meta.rtype + '|' + St.meta.view + '|' + BASE, () => {
    const rs = scopeRounds().map(analyzeRound);
    const adj = St.meta.view === 'ctx';
    const rows = rs.flatMap(r => r.rows).map(x => Object.assign(x, { v: adj ? x.sgA : x.sg }));
    const holes = rs.flatMap(r => r.holes).filter(h => h.done);
    const nR = Math.max(1, rs.reduce((a, r) => a + r.nDone / 18, 0));
    return { rs, rows, holes, nR, adj, ex: St.ex };
  });
}

const UI = {

  tbl(head, rows, o = {}){ return `<div class="tw"><table><thead><tr>${head.map((h, i) => `<th${o.num && o.num.includes(i) ? ' class="n"' : ''}>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td${o.num && o.num.includes(i) ? ' class="n"' : ''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; }

const tipA = t => ` data-tip="${esc(t)}"`;
const sgCol = v => v >= 0 ? 'var(--gain)' : 'var(--loss)';
const lin = (a, b, c, d) => v => c + (v - a) / ((b - a) || 1) * (d - c);

const Ch = {
  /* horizontal diverging bars around zero */
  bars(items, o = {}){
    const it = items.filter(i => i.n && fin(i.v));
    if (!it.length) return UI.empty(o.empty || 'No shots in this group yet');
    const W = 560, rh = 30, H = items.length * rh + 6, L = o.lw || 168, R = 78;
    const m = Math.max(o.min || .1, ...it.map(i => Math.abs(i.v))) * 1.1, x = lin(-m, m, L, W - R);
    let g = `<line x1="${x(0)}" x2="${x(0)}" y1="0" y2="${H}" stroke="var(--base)" stroke-dasharray="3 3"/>`;
    items.forEach((i, k) => {
      const y = 4 + k * rh;
      g += `<text x="${L - 8}" y="${y + 17}" text-anchor="end" class="lbl" font-size="12">${esc(i.l)}</text>`;
      if (!i.n || !fin(i.v)){ g += `<text x="${x(0) + 6}" y="${y + 17}" font-size="11">no shots</text>`; return; }
      const x0 = x(0), x1 = x(i.v);
      g += `<rect x="${Math.min(x0, x1)}" y="${y + 5}" width="${Math.max(2, Math.abs(x1 - x0))}" height="${rh - 12}" rx="3" fill="${sgCol(i.v)}"${tipA(i.tip || `${i.l}\n${sgT(i.v)} ${o.unit || ''}\n${i.n} shots`)} tabindex="0"/>`;
      g += `<text x="${W - R + 6}" y="${y + 17}" font-size="11.5" class="lbl">${o.fmt ? o.fmt(i.v) : sgT(i.v)}</text><text x="${W - 4}" y="${y + 17}" text-anchor="end" font-size="10">${i.n}</text>`;
    });
    return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'Bar chart')}">${g}</svg>`;
  },
  /* per-round trend: total bars + rolling line */
  trend(rs, key){
    const done = rs.filter(r => r.nDone >= 9).slice().reverse();
    if (!done.length) return UI.empty('No completed rounds yet');
    const W = 560, H = 210, L = 40, R = 14, Tm = 14, B = 26;
    const vals = done.map(r => key === 'total' ? (St.meta.view === 'ctx' ? r.sgA : r.sg) : (St.meta.view === 'ctx' ? r.catsA : r.cats)[key]);
    const m = Math.max(1, ...vals.map(v => Math.abs(v))) * 1.15, y = lin(-m, m, H - B, Tm);
    const slot = (W - L - R) / done.length, bw = Math.min(26, slot * .6);

/* =====================================================================
   Stats calculations
   ===================================================================== */
const S = {
  rate(arr){ const a = arr.filter(x => x != null); return { r: a.length ? a.filter(Boolean).length / a.length : NaN, n: a.length, k: a.filter(Boolean).length }; },
  slice(rows, f, nR){ const a = rows.filter(f); return { n: a.length, v: sum(a.map(x => x.v)) / nR, per: mean(a.map(x => x.v)) }; },
  leaks(A){

    const appB = [[30,75],[75,100],[100,125],[125,150],[150,175],[175,200],[200,225],[225,999]];
    appB.forEach(([a, b]) => ['fairway','rough'].forEach(lie => add(`Approach ${b > 900 ? a + '+' : a + '–' + b} yds from the ${lie}`, rows.filter(x => x.cat === 'APP' && x.yd >= a && x.yd < b && (lie === 'fairway' ? ['fairway','first_cut','tee'].includes(x.lie) : ['rough','deep_rough'].includes(x.lie))), lie === 'fairway' ? `Stock-distance work from ${a}–${b} yds: 10 balls to one flag, score feet from the hole.` : `Rough practice from ${a}–${b} yds: learn how much less spin and more release you get.`, 'app')));
    [[0,5],[5,10],[10,20],[20,35],[35,999]].forEach(([a, b]) => add(`Putts ${b > 900 ? a + '+' : a + '–' + b} ft`, rows.filter(x => x.cat === 'PUTT' && x.d >= a && x.d < b), b <= 10 ? 'Start-line and short putts: 50 balls a night from 3–8 ft through a gate.' : a >= 20 ? 'Speed: lag ladders from 25–50 ft, scoring putts that finish inside 3 ft.' : 'Reading and start line from 10–20 ft: one ball, full read, from a new side each time.', 'putt'));

    const tee = rows.filter(x => x.cat === 'OTT');
    add('Tee shots missed left', tee.filter(x => x.eLie !== 'fairway' && lateral(x.dir) < 0), 'Check driver face-to-path; on tight holes aim at the right half and take the left side out of play.', 'ott');
    add('Tee shots missed right', tee.filter(x => x.eLie !== 'fairway' && lateral(x.dir) > 0), 'Check driver face-to-path; on tight holes aim at the left half and take the right side out of play.', 'ott');
    add('Penalty strokes', rows.filter(x => x.pen), 'Pick the club and line that take the penalty side out of play, even if it costs 20 yards.', 'pen');
    /* shape habits: intended vs actual */
    for (const [cg, a] of groupBy(rows.filter(x => x.cat === 'APP' || x.cat === 'OTT'), x => x.cg)){

  /* green centre for this hole: saved on the round and on the course */
  courseHole(r, hi){ const c = St.courses[r.courseId]; if (!c) return null; return c.holes[(r.startHole || 1) - 1 + hi] || null; },
  greenOf(r, hi){ const h = r.holes[hi]; if (h && h.green) return h.green; const ch = Entry.courseHole(r, hi); return ch && ch.green ? ch.green : null; },
  async gps(which){
    const r = Entry.round(); if (!r) return;
    const d = St.active.edit ? St.active.edit.s : Entry.ensure();
    const g = Entry.greenOf(r, St.active.hole);
    if (which !== 'mark' && !g) return UI.toast('This green is not mapped yet. Tap Mark green while standing on it.');
    UI.toast('Getting your position…');
    let c; try { c = await Geo.get(); } catch (e) { return UI.toast(e.message); }
    const acc = Math.round((c.accuracy || 0) * 1.094);
    if (which === 'mark'){
      const pt = { lat: c.latitude, lng: c.longitude };
      r.holes[St.active.hole].green = pt; saveRound(r);
      const ch = Entry.courseHole(r, St.active.hole); if (ch){ ch.green = pt; saveCourse(St.courses[r.courseId]); }
      App.render(); return UI.toast(`Green ${St.active.hole + (r.startHole || 1)} saved (±${acc} yds).`);
    }
    const y = Math.round(Geo.yds({ lat: c.latitude, lng: c.longitude }, g));
    if (which === 'd'){ d.d = isFt(d.lie) ? y * 3 : y; if (!tm(r) && (!d.club || d.club === d.sugg)){ d.club = Entry.suggestClub(d.d, d.lie, Entry.hole().par); d.sugg = d.club; } }
    else { if (!d.eLie || isFt(d.eLie)) d.eLie = d.eLie && !isFt(d.eLie) ? d.eLie : 'fairway'; d.eD = y; }
    saveLocal(); App.render(); UI.toast(`${y} yds to the middle of the green (±${acc} yds)`);
  },
  bar(r, hi, h, an, rel, thru, shotNo, editing){
    const no = hi + (r.startHole || 1);
    return `<div class="holebar"><button data-act="goto" data-v="${hi - 1}" ${hi <= 0 || editing ? 'disabled' : ''} aria-label="Previous hole">‹</button>

      <button data-act="hole-shots" aria-label="Shots on this hole" ${editing ? 'disabled' : ''}>≡</button>
      <button data-act="goto" data-v="${hi + 1}" ${hi >= r.holes.length - 1 || editing ? 'disabled' : ''} aria-label="Next hole">›</button></div>`;
  },
  strip(r, an, hi){
    return `<div class="strip" aria-label="Holes">${r.holes.map((h, i) => { const a = an.holes[i]; return `<button data-act="goto" data-v="${i}" aria-current="${i === hi}"><span>${i + (r.startHole || 1)}</span>${a.done ? UI.sc(a.score, a.par).replace('class="sc', 'style="min-width:20px;height:20px;font-size:12px" class="sc') : `<span style="height:20px;line-height:20px">${h.shots.length ? '…' : '·'}</span>`}</button>`; }).join('')}</div>`;
  },
  holeShots(){

    UI.sheet(`<div class="row between"><h2>Hole ${hi + (r.startHole || 1)} shots</h2><button class="btn sm" data-act="close">Close</button></div>
      ${an.rows.length ? UI.tbl(['#','Club','From','Result', ...(safe ? [] : ['SG']), ''], an.rows.map(x => [x.n, esc(x.club || '—'), Fmt.dist(x.d, x.lie) + ' <span class="dim small">' + esc(LIE[x.lie]) + '</span>', x.holed ? '⛳ Holed' : x.eLie ? Fmt.dist(x.eD, x.eLie) + ' <span class="dim small">' + esc(LIE[x.eLie] || '') + '</span>' + (x.pen ? ' <span class="tag act">+1</span>' : '') : '<span class="dim">in progress</span>', ...(safe ? [] : [sgH(x.sg)]), `<button class="btn sm" data-act="edit-shot" data-r="${r.id}" data-h="${hi}" data-s="${x.idx}">Edit</button>`]), { num: safe ? [] : [4] }) : UI.empty('No shots yet on this hole')}
      <div class="row" style="margin-top:12px">${h.shots.length ? '<button class="btn warn sm" data-act="undo">Undo last shot</button>' : ''}<button class="btn sm" data-act="end-round">Finish round now</button>${r.tmode ? '<button class="btn sm" data-act="tmode-off">Turn off rules-safe mode</button>' : '<button class="btn sm" data-act="tmode-on">Turn on rules-safe mode</button>'}</div>

  st_short(A){

        ${UI.card('How you miss', `<div class="kpis">${PMISS.map(([k, l]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${pct(mshare(k))}</div></div>`).join('')}</div>`, `${miss.length} missed putts with a miss logged. More high-side than low-side misses means you are giving putts enough break.`)}

  st_scoring(A){

    const bbA = sum(rs.map(r => r.bbA)), bbS = sum(rs.map(r => r.bbS));

        ${UI.card('Tiger 5, per round', UI.tbl(['Mistake','Per round'], t5, { num: [1] }), 'Scott Fawcett’s Tiger 5. Most strokes between a +5 and a Tour player hide in these five.')}
        ${UI.card('By par', UI.tbl(['Par','Holes','Average','vs par','SG / hole'], [3,4,5].map(p => { const b = byPar(p); return [p, b.n, fin(b.avg) ? b.avg.toFixed(2) : '—', fin(b.avg) ? (b.avg - p >= 0 ? '+' : MINUS) + Math.abs(b.avg - p).toFixed(2) : '—', sgH(b.sg)]; }), { num: [1,2,3,4] }))}
        ${UI.card('Par 5s: going for it', go.length ? UI.tbl(['','Holes','Average score','Birdie+'], [['Went for the green', go.filter(h => h.go)], ['Laid up', go.filter(h => !h.go)]].map(([l, a]) => [l, a.length, a.length ? mean(a.map(h => h.score)).toFixed(2) : '—', a.length ? pct(a.filter(h => h.rel <= -1).length / a.length) : '—']), { num: [1,2,3] }) : UI.empty('No par 5 second shots yet'), 'Second shots on par 5s marked Lay up count as layups; everything else is going for it.')}

  st_clubs(A){

    const order = St.meta.bag.map(b => b[0]);

      return [`<b>${esc(c)}</b>`, a.length, sgH(sum(a.map(x => x.v)) / nR), sgH(mean(a.map(x => x.v)), 3), m.length ? pct(m.filter(x => x.dir === 'C').length / m.length) : '—', m.length ? `${pct(L / m.length)} / ${pct(R / m.length)}` : '—', m.length ? `${pct(Sh / m.length)} / ${pct(Lg / m.length)}` : '—']; });
    const planned = full.filter(x => x.shape && x.act && x.yd > 30);
    const groups = [...groupBy(planned, x => x.cg)];
    const habit = groups.map(([g, a]) => { const SH = ['draw','straight','fade','hook','slice','push','pull']; return [`<b>${esc(g)}</b>`, a.length, ...['draw','straight','fade'].map(int => { const b = a.filter(x => x.shape === int); if (!b.length) return '<span class="dim">·</span>'; const ok = b.filter(x => x.act === 'asplan' || x.act === int); const top = [...groupBy(b.filter(x => !(x.act === 'asplan' || x.act === int)), x => x.act)].sort((p, q) => q[1].length - p[1].length)[0]; return `${pct(ok.length / b.length)} on plan<div class="tiny mute">${b.length} planned${top ? ` · misses: ${top[0]}` : ''}</div>`; })]; });

        <section class="card"><h3>Your bag</h3><form id="f-bag" onsubmit="return false">${UI.tbl(['Club','Carry','Total'], St.meta.bag.filter(b => b[0] !== 'Putter').map((b, i) => [`<input id="bn${i}" type="text" value="${esc(b[0])}" style="min-width:64px">`, `<input id="bc${i}" type="number" inputmode="numeric" value="${b[1]}" style="min-width:70px">`, `<input id="bt${i}" type="number" inputmode="numeric" value="${b[2]}" style="min-width:70px">`]))}<button class="btn pri block" style="margin-top:10px" data-act="save-bag">Save bag</button></form><p class="why">Used to suggest a club from the distance. Suggestions are hidden in rules-safe rounds.</p></section>
        <section class="card"><h3>Your data</h3><p class="small mute">${real.length} round${real.length === 1 ? '' : 's'} and ${Object.values(St.courses).filter(c => !c.deleted).length} course${Object.values(St.courses).filter(c => !c.deleted).length === 1 ? '' : 's'} saved on this device.</p>
          <div class="grid"><button class="btn block" data-act="export">Back up everything (JSON)</button><button class="btn block" data-act="export-csv">Export every shot (CSV for Excel or Sheets)</button>
          <label class="btn block" for="imp-file" style="cursor:pointer">Restore or merge a backup<input id="imp-file" type="file" accept=".json,application/json" hidden></label></div>
          <p class="why">Restoring merges: the newest version of each round wins, nothing is deleted.</p></section>
        <section class="card"><h3>App</h3><p class="small mute">Shot Lab ${APP_VERSION} · ${isStandalone() ? 'running as a Home Screen app' : 'running in the browser'} · ${navigator.onLine ? 'online' : 'offline'}</p>
          <button class="btn sm" data-act="check-update">Check for update</button>
          ${!isStandalone() ? `<p class="small mute" style="margin-top:10px">To install on iPhone: open this page in Safari, tap Share, then <b>Add to Home Screen</b>.</p>` : ''}</section>
      </div>`;
  },
  how(){
    $('#view').innerHTML = `<div class="howto"><div class="pagehead"><div><h1>How Shot Lab works</h1></div></div>
      <h2>Strokes gained</h2><p>Every spot on a course has an <b>expected number of strokes to hole out</b> for a Tour player. From 150 yards in the fairway that is about ${E(150, 'fairway').toFixed(2)}; from 8 feet on the green about ${E(8, 'green').toFixed(2)}. A shot's strokes gained is how much it improved your position, minus the stroke it cost:</p>
      <p class="formula">SG = expected(before) − expected(after) − 1</p>
      <p>Holed shots leave an expected value of 0. A penalty costs one extra stroke. Each shot starts exactly where the previous one finished, so a hole's shots always add up to <b>expected(tee) − your score</b>, and a round's total is the sum of its shots.</p>
      <p>Categories follow the PGA Tour: <b>off the tee</b> is tee shots on par 4s and 5s; <b>approach</b> is every other shot from more than 30 yards, par-3 tee shots included; <b>around the green</b> is inside 30 yards off the green; <b>putting</b> is on the green.</p>
      <h2>PGA Tour SG and Context SG</h2><p><b>PGA Tour SG</b> uses distance and lie type only (tee, fairway, rough, sand, recovery, green). That is how ShotLink does it, so your numbers compare directly with Tour players. First cut sits halfway between fairway and rough; deep rough adds part of the gap to recovery; fringe uses the better of fairway and a putt.</p>
      <p><b>Context SG</b> adds what you log before the shot. The wind and elevation change the distance the shot plays (about 1% longer per mph into the wind, 0.5% shorter per mph helping, and one yard per three feet of elevation). How the ball is sitting and your stance add difficulty: a flyer lie, a ball sitting down, a plugged bunker lie or a downhill stance raise the expected strokes, a ball sitting up lowers them. Breaking and downhill putts count as harder. These adjustments are estimates; they let you see whether you handled a hard shot well, not only whether it went close.</p>
      <h2>What the stats mean</h2><ul>
        <li><b>Fairways</b>: tee shots on par 4s and 5s that finish on the short grass. First cut counts as a miss, as on Tour.</li>
        <li><b>Greens in regulation</b>: on the green with two strokes or more to spare, penalties counted.</li>
        <li><b>Proximity</b>: feet from the hole for approaches that finish on the green. Layups and punch-outs are left out.</li>
        <li><b>Scrambling</b>: par or better after missing the green. <b>Sand saves</b>: up and down in two from a greenside bunker.</li>
        <li><b>Tiger 5</b>: double bogeys, three-putts, bogeys on par 5s, bogeys with an approach from inside 150 yards, and needing three or more from an easy chip inside 20 yards.</li>
        <li><b>Leaks</b> need 15 or more shots before they are marked <b>act</b>; below that they are <b>watch</b>.</li></ul>
      <h2>Tour numbers</h2><p>The expected-strokes tables, make rates, proximity numbers and traditional stats are approximations of published PGA Tour averages, not official ShotLink data.</p>
      <h2>Baselines</h2><p>The <b>PGA Tour</b> baseline uses approximate Tour averages. The <b>scratch</b> baseline adds an estimated gap that grows with distance, worth about 4.5 strokes over a typical round, so you can see where you already play at scratch level and where you lose to it.</p>
      <h2>Rules-safe mode</h2><p>Under Rule 4.3a you may record statistics during a round, but a device must not process or interpret playing information from that round, recommend a club, or give plays-like distances that allow for elevation. With rules-safe mode on, Shot Lab hides club suggestions, plays-like yardage and all strokes gained for the round in progress until you finish it. GPS distance to the middle of the green stays on, because plain distance is allowed (unless a Local Rule bans distance devices). Check the terms of each competition.</p>
      <h2>GPS distances</h2><p>Stand on a green and tap <b>Mark green</b> once. The location is saved with the course, so next time <b>GPS to green</b> fills in the distance to the middle of that green from wherever you stand. Accuracy is usually 3 to 10 yards. Use your rangefinder or a sprinkler head when it matters more.</p>
      <h2>Your data</h2><p>Every tap saves on this device straight away, in two places (local storage and IndexedDB), so a round survives a dead signal or a closed app. Turn on sync in Setup to share rounds between your phone and laptop through a private GitHub gist, and use <b>Back up everything</b> now and then.</p>
      <h2>For your other apps</h2><p>Each time Home is opened, Shot Lab writes a short summary (SG per round by category and your top five leaks with drills) to <code>localStorage['shotlab.summary']</code>. Any other app hosted on the same GitHub Pages site can read it.</p></div>`;
  }
};

/* =====================================================================
   App: routing + events
   ===================================================================== */
const App = {
  render(){
    try {
      BASE = St.meta.base === 'scratch' ? 'scratch' : 'tour';
      const h = (location.hash || '#home').slice(1);
      const [page, ...rest] = h.split('-'); const arg = rest.join('-');
      Wake.want(page === 'play' && !!(St.active && St.rounds[St.active.rid]) && St.meta.wake !== false);
      document.querySelectorAll('nav.tabs a').forEach(a => { const p = a.getAttribute('href').slice(1).split('-')[0]; a.setAttribute('aria-current', p === page || (page === 'round' && p === 'rounds') ? 'page' : 'false'); });
      if (page === 'play') return St.active && St.rounds[St.active.rid] ? Entry.render() : Views.playStart();
      if (page === 'rounds') return Views.rounds();
      if (page === 'round') return Views.round(arg);
      if (page === 'stats') return Views.stats(arg);
      if (page === 'log') return Views.log();
      if (page === 'setup') return Views.setup();
      if (page === 'how') return Views.how();
      return Views.home();
    } catch (e){ console.error(e); $('#view').innerHTML = UI.empty('This page hit an error', e.message); }
  },
  startRound(){
    const cid = $('#s-course').value; if (cid === 'new') return Views.courseForm();
    const c = St.courses[cid]; if (!c) return UI.toast('Add a course first.');
    const missing = c.holes.findIndex(h => !h.yards); if (missing >= 0){ Views.courseForm(c); return UI.toast(`Add the yardage for hole ${missing + 1} first.`); }
    let which = $('#s-holes').value; if (c.holes.length < 18 && which !== '18') which = '18';
    const holes = c.holes.map(h => ({ par: h.par, yards: h.yards, si: h.si, shots: [], done: false }));
    const sel = which === 'f9' ? holes.slice(0, 9) : which === 'b9' ? holes.slice(9) : holes;
    const r = { id: 'r' + uid(), created: Date.now(), date: $('#s-date').value || today(), course: c.name, tees: c.tees, courseId: c.id, type: $('#s-type').value, event: $('#s-event').value.trim(), rnd: $('#s-rnd').value,
      tmode: $('#s-tmode').value === 'on', startHole: which === 'b9' ? 10 : 1, weather: { ws: +$('#s-ws').value, wd: 'calm', temp: +$('#s-temp').value || null, stimp: +$('#s-stimp').value || null, firm: $('#s-firm').value }, holes: sel, status: 'open' };
    saveRound(r); St.active = { rid: r.id, hole: 0, draft: null }; Entry.ensure(); saveLocal(); App.render(); window.scrollTo({ top: 0 });
  },
  init(){
    loadLocal(); Sync.load(); applyTheme();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-set],[data-act]'); if (!t) return;
      if (t.dataset.set){
        const f = t.dataset.set;
        if (f.startsWith('meta:')){ const k = f.slice(5); St.meta[k] = k === 'wake' ? t.dataset.v === 'on' : t.dataset.v; saveMeta(); if (k === 'theme') applyTheme(); App.render(); return; }
        Entry.set(f, t.dataset.v); return;
      }
      const a = t.dataset.act, v = t.dataset.v;
      const act = {
        'start-round': App.startRound,
        'new-course': () => Views.courseForm(),
        'edit-course': () => Views.courseForm(St.courses[v]),
        'save-course': () => { const c = Views.readCourseForm(); if (!c.name) return UI.toast('Give the course a name.'); const miss = c.holes.findIndex(h => !h.yards); if (miss >= 0){ UI.toast(`Enter the yardage for hole ${miss + 1}.`); const el = $('#cy' + miss); if (el) el.focus(); return; } saveCourse(c); UI.close(); App.render(); UI.toast('Course saved'); const s = $('#s-course'); if (s) s.value = c.id; },
        'del-course': () => { const c = St.courses[v]; if (!c) return; c.deleted = true; saveCourse(c); UI.close(); App.render(); UI.toast('Course deleted. Its rounds are kept.'); },
        'entry-mode': () => { St.meta.entry = v; saveMeta(); App.render(); },
        'gps-d': () => Entry.gps('d'), 'gps-e': () => Entry.gps('e'), 'mark-green': () => Entry.gps('mark'),
        'tmode-on': () => { const r = Entry.round(); r.tmode = true; saveRound(r); if (St.active.draft && St.active.draft.club === St.active.draft.sugg){ St.active.draft.sugg = null; } UI.close(); App.render(); UI.toast('Rules-safe mode on'); },
        'tmode-off': () => { const r = Entry.round(); r.tmode = false; saveRound(r); UI.close(); App.render(); UI.toast('Rules-safe mode off'); },
        'hide-install': () => { try { localStorage.setItem('shotlab.hideInstall', '1'); } catch (_){ } App.render(); },
        'sync-connect': async () => { const tok = ($('#sync-token').value || '').trim(); if (!tok) return UI.toast('Paste your GitHub token first.'); UI.toast('Connecting…'); try { await Sync.connect(tok); UI.toast(Sync.state === 'ok' ? 'Sync is on' : (Sync.msg || 'Saved. Will sync when online.')); } catch (err){ Sync.cfg = null; Sync.saveCfg(); Sync.setState('local'); UI.toast(err.status === 401 ? 'GitHub rejected that token.' : err.status === 403 ? 'That token needs the gist permission.' : 'Could not reach GitHub. Check your connection.'); } App.render(); },
        'sync-now': () => Sync.now(),
        'sync-off': () => { Sync.disconnect(); App.render(); UI.toast('This device is no longer syncing. Its data stays here.'); },
        'export-csv': () => exportFile(`shotlab-shots-${today()}.csv`, shotsCSV(), 'text/csv'),
        'check-update': async () => { if (!App.swReg) return UI.toast('Updates load automatically when you open the app online.'); UI.toast('Checking…'); try { await App.swReg.update(); setTimeout(() => { if (!App.waiting) UI.toast('You have the latest version.'); }, 2500); } catch (_){ UI.toast('Could not check right now.'); } },
        'apply-update': () => { if (App.waiting) App.waiting.postMessage('skipWaiting'); else location.reload(); },
        'close': UI.close,
        'resume': () => { const r = St.rounds[v]; if (!r) return; r.status = 'open'; const hi = Math.max(0, r.holes.findIndex(h => !h.done)); St.active = { rid: r.id, hole: hi, draft: null }; Entry.ensure(); saveRound(r); location.hash = '#play'; App.render(); },
        'commit': () => Entry.commit(false),
        'commit-holed': () => { if (St.active && St.active.edit) return act['edit-holed'](); Entry.commit(true); },
        'edit-holed': () => { const d = St.active.edit.s; d.holed = true; d.miss = null; Entry.saveEdit(); },
        'save-edit': Entry.saveEdit,
        'cancel-edit': () => { const b = St.active.edit.back; const r = St.rounds[St.active.edit.rid]; St.active.edit = null; Entry.restore(r); saveLocal(); location.hash = b || '#play'; App.render(); },
        'adj': () => { const d = St.active.edit ? St.active.edit.s : Entry.ensure(); d.d = r1(Math.max(0, (d.d || 0) + +v)); if (!tm(Entry.round()) && (d.lie === 'tee' || !d.club || d.club === d.sugg)){ const h = Entry.hole(); d.club = Entry.suggestClub(d.d, d.lie, h ? h.par : 4); d.sugg = d.club; } saveLocal(); App.render(); },
        'eft': () => { const d = St.active.edit ? St.active.edit.s : Entry.ensure(); d.eD = +v; if (!d.eLie || d.lie === 'green') d.eLie = 'green'; d.holed = false; saveLocal(); App.render(); },
        'goto': () => Entry.goto(+v),
        'hole-shots': Entry.holeShots,
        'undo': Entry.undo,
        'edit-shot': () => Entry.startEdit(t.dataset.r, +t.dataset.h, +t.dataset.s),
        'end-round': () => { const r = Entry.round(); r.status = 'done'; saveRound(r); St.active = null; saveLocal(); UI.close(); location.hash = '#round-' + r.id; },
        'hsel': () => { Views.hsel.h = +v; App.render(); },
        'del-round': () => UI.sheet(`<h2>Delete this round?</h2><p class="mute">It is removed from your stats on every device.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Cancel</button><button class="btn warn" data-act="del-round-yes" data-v="${v}">Delete round</button></div>`),
        'del-round-yes': () => { const r = St.rounds[v]; if (r){ r.deleted = true; saveRound(r); if (St.active && St.active.rid === v) St.active = null; saveLocal(); } UI.close(); location.hash = '#rounds'; App.render(); UI.toast('Round deleted'); },
        'save-bag': () => { const bag = St.meta.bag.filter(b => b[0] !== 'Putter').map((b, i) => [$('#bn' + i).value.trim() || b[0], +$('#bc' + i).value || b[1], +$('#bt' + i).value || b[2]]); bag.push(['Putter', 0, 0]); St.meta.bag = bag; saveMeta(); UI.toast('Bag saved'); },
        'export': () => exportFile(`shotlab-backup-${today()}.json`, JSON.stringify({ app: 'shotlab', v: 3, exported: new Date().toISOString(), rounds: St.rounds, courses: St.courses, meta: St.meta }), 'application/json')
      }[a];
      if (act){ e.preventDefault(); if (t.getAttribute('aria-disabled') === 'true' && a === 'commit'){ UI.toast('Pick where the ball finished and the distance left.'); return; } try { act(); } catch (err){ console.error(err); UI.toast('Something went wrong: ' + err.message); } }
    });
    document.addEventListener('input', e => {
      const t = e.target;
      if (t.dataset.num){ const d = St.active && St.active.edit ? St.active.edit.s : Entry.ensure(); if (!d) return; Entry.typing = true; const n = parseFloat(t.value); d[t.dataset.num] = isFinite(n) ? n : null; if (t.dataset.num === 'eD' && d.lie === 'green' && !d.eLie) d.eLie = 'green'; saveLocal(); Entry.liveUpdate(); }
      else if (t.dataset.txt){ const d = St.active && St.active.edit ? St.active.edit.s : Entry.ensure(); if (d){ d[t.dataset.txt] = t.value; saveLocal(); } }
    });
    document.addEventListener('change', e => {
      const t = e.target;
      if (t.dataset.num){ Entry.typing = false; const d = St.active && St.active.edit ? St.active.edit.s : Entry.ensure(); Entry.liveUpdate();
        /* re-render a moment later, so the tap on Next that caused this blur still lands */
        if (t.dataset.num === 'd' && d){ if (d.club === d.sugg && !tm(Entry.round())){ const h = Entry.hole(); d.club = Entry.suggestClub(d.d, d.lie, h ? h.par : 4); d.sugg = d.club; } clearTimeout(Entry.rt); Entry.rt = setTimeout(() => { const ae = document.activeElement; if (!ae || !ae.dataset || !ae.dataset.num) App.render(); }, 400); }
        return; }
      if (t.dataset.meta){ St.meta[t.dataset.meta] = t.value; saveMeta(); App.render(); return; }
      if (t.dataset.logf){ Views.logF[t.dataset.logf] = t.value; App.render(); return; }
      if (t.dataset.rnote){ const r = St.rounds[t.dataset.rnote]; if (r){ r.notes = t.value; saveRound(r); UI.toast('Notes saved'); } return; }
      if (t.id === 's-course' && t.value === 'new') Views.courseForm();
      if (t.id === 's-type'){ const m = $('#s-tmode'); if (m) m.value = ['tournament','qualifier'].includes(t.value) ? 'on' : 'off'; }
      if (t.dataset.cn){ const c = Views.readCourseForm(), n = +t.value; while (c.holes.length < n) c.holes.push({ par: 4, yards: null, si: null }); c.holes.length = n; Views.courseForm(c); return; }
      if (t.id === 'imp-file' && t.files && t.files[0]){ const f = t.files[0]; f.text().then(txt => { let o; try { o = JSON.parse(txt); } catch (_){ return UI.toast('That file is not a Shot Lab backup.'); } if (!o || (typeof o.rounds !== 'object' && typeof o.courses !== 'object')) return UI.toast('That file is not a Shot Lab backup.'); const before = realRounds().length; mergeData(o); saveLocal(); Cache.clear(); Sync.soon(1500); App.render(); UI.toast(`Backup merged: ${realRounds().length - before} new round(s).`); }); t.value = ''; return; }
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') UI.close(); if (e.key === 'Enter' && e.target.dataset && e.target.dataset.num){ e.target.blur(); } });
    $('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') UI.close(); });
    addEventListener('hashchange', () => { App.render(); window.scrollTo(0, 0); });
    /* tooltips */
    const tip = $('#tip');
    const show = (el, x, y) => { tip.textContent = el.getAttribute('data-tip'); tip.classList.add('on'); const r = tip.getBoundingClientRect(); tip.style.left = clamp(x + 12, 6, innerWidth - r.width - 6) + 'px'; tip.style.top = clamp(y - r.height - 10, 6, innerHeight - r.height - 6) + 'px'; };
    document.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; const el = e.target.closest && e.target.closest('[data-tip]'); if (el) show(el, e.clientX, e.clientY); else tip.classList.remove('on'); });
    document.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') return; const el = e.target.closest && e.target.closest('[data-tip]'); if (el) show(el, e.clientX, e.clientY); else tip.classList.remove('on'); });
    document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el){ const r = el.getBoundingClientRect(); show(el, r.left + r.width / 2, r.top); } });
    document.addEventListener('focusout', () => tip.classList.remove('on'));
    if (!location.hash) location.hash = St.active && St.rounds[St.active.rid] ? '#play' : '#home';
    App.render();
    loadDurable();
    Sync.soon(800);
    addEventListener('online', () => Sync.soon(1000));
    addEventListener('offline', () => { if (Sync.on()) Sync.setState('off'); });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden'){ IDB.set('data', snapshot()); if (Sync.timer) Sync.now(); }
      else { App.render(); if (Sync.on() && (!Sync.cfg.last || Date.now() - Sync.cfg.last > 60000)) Sync.soon(500); }
    });
    App.sw();
  },
  sw(){
    if (!('serviceWorker' in navigator) || !(location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) return;
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloading) return; reloading = true; location.reload(); });
    navigator.serviceWorker.register('sw.js').then(reg => {
      App.swReg = reg;
      const ready = w => { App.waiting = w; const b = $('#upd'); if (b) b.hidden = false; };
      if (reg.waiting && navigator.serviceWorker.controller) ready(reg.waiting);
      reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) ready(w); }); });
    }).catch(() => {});
  }
};
if (typeof document !== 'undefined' && document.getElementById('view')) App.init();
</script>
