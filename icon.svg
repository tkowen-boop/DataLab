<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#15734b"/>
      <stop offset="0.55" stop-color="#0d4a31"/>
      <stop offset="1" stop-color="#062618"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.34" r="0.55">
      <stop offset="0" stop-color="#f2c230" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f2c230" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ff0b4"/>
      <stop offset="1" stop-color="#3fae6c"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#glow)"/>
  <g transform="translate(0,-26)">
  <!-- baseline -->
  <rect x="196" y="784" width="632" height="10" rx="5" fill="#ffffff" opacity="0.18"/>
  <!-- strokes-gained bars, rising -->
  <rect x="226" y="664" width="96" height="120" rx="18" fill="url(#bar)" opacity="0.55"/>
  <rect x="352" y="584" width="96" height="200" rx="18" fill="url(#bar)" opacity="0.75"/>
  <rect x="478" y="494" width="96" height="290" rx="18" fill="url(#bar)"/>
  <!-- green and hole -->
  <ellipse cx="716" cy="744" rx="128" ry="34" fill="#79bf6a" opacity="0.95"/>
  <ellipse cx="716" cy="744" rx="22" ry="8" fill="#062618"/>
  <!-- flag -->
  <rect x="709" y="292" width="14" height="452" rx="7" fill="#f4f7f2"/>
  <path d="M723 300 L866 352 L723 404 Z" fill="#f2c230"/>
  <!-- ball flight tracer -->
  <path d="M250 640 C 340 230, 560 170, 646 706" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" opacity="0.18" filter="url(#soft)"/>
  <path d="M250 640 C 340 230, 560 170, 646 706" fill="none" stroke="url(#trace)" stroke-width="20" stroke-linecap="round"/>
  <!-- ball -->
  <circle cx="646" cy="712" r="30" fill="#ffffff"/>
  <circle cx="637" cy="703" r="4.5" fill="#cfd8d2"/><circle cx="653" cy="701" r="4.5" fill="#cfd8d2"/><circle cx="645" cy="717" r="4.5" fill="#cfd8d2"/><circle cx="659" cy="719" r="4.5" fill="#cfd8d2"/><circle cx="632" cy="720" r="4.5" fill="#cfd8d2"/>
  </g>
</svg>
